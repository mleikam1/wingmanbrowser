apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: wingman-content-read
  namespace: REPLACE_NEW_DEDICATED_PROJECT_NUMBER
  annotations:
    run.googleapis.com/maxScale: '2'
spec:
