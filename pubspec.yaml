name: wingman_browser
description: "Wingman Browser. We've got your back, not your data."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.26.1
  sqflite: ^2.4.4
  sqflite_common_ffi_web: ^1.1.3
  path: ^1.9.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Roboto_LICENSE.txt
    - assets/fonts/NotoSansSymbols_OFL.txt
  # Flutter's default family name prevents its default remote Roboto download.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Noto Sans Symbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols.ttf

# Exposes WK configuration for assigning private storage before construction.
# Scope and upstream provenance: third_party/.../WINGMAN_PATCH.md.
dependency_overrides:
  webview_flutter_wkwebview:
    path: third_party/webview_flutter_wkwebview
