name: wingman_browser
description: "Wingman Browser. We've got your back, not your data."
publish_to: none
version: 0.14.0+16

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.4
  sqflite_common_ffi_web: ^1.1.3
  path: ^1.9.1
  html: ^0.15.7
  xml: ^7.0.1
  crypto: ^3.0.7
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/brand/wingman-mark.png
    - assets/signature/official_routes.json
    - assets/policy/manifest.json
    - assets/policy/catalog.json
    - assets/policy/public_keys.json
    - assets/policy/articles/
    - assets/policy/consumer_protection.json
    - assets/policy/consumer_update_keys.json
    - assets/policy/consumer_sources/
    - assets/policy/live_sites.json
    - assets/policy/live_privacy_license.txt
    - assets/discovery/
    - assets/story_images/
    - assets/live_content/sources.json
    - assets/fonts/Roboto_LICENSE.txt
    - assets/fonts/NotoSansSymbols_OFL.txt
  # Flutter's default family name prevents its default remote Roboto download.
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Noto Sans Symbols
      fonts:
        - asset: assets/fonts/NotoSansSymbols.ttf
